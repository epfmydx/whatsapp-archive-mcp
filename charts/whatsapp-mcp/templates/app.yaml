apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wa.fullname" . }}
  labels:
    {{- include "wa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: app}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: app}
    spec:
      {{- with .Values.app.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wa.fullname" . }}-app
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ include "wa.security" . | nindent 8 }}
      containers:
        - name: app
          image: {{ include "wa.image" (dict "root" . "image" .Values.app.image) | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: [python, -m, app]
          ports: [{name: http, containerPort: 8000}]
          securityContext: {{ include "wa.containerSecurity" . | nindent 12 }}
          env: {{ include "wa.httpAppEnv" . | nindent 12 }}
          resources: {{ toYaml .Values.app.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http, httpHeaders: [{name: Host, value: {{ (urlParse .Values.app.baseUrl).host | quote }}}]}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: {{ (urlParse .Values.app.baseUrl).host | quote }}}]}, initialDelaySeconds: 20, periodSeconds: 20}
          volumeMounts:
            {{- include "wa.archiveReadMount" . | nindent 12 }}
            - {name: tmp, mountPath: /tmp}
            {{- include "wa.databaseMount" . | nindent 12 }}
      volumes:
        {{- include "wa.archiveVolume" . | nindent 8 }}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- include "wa.databaseVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wa.fullname" . }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, component: app}
  ports: [{name: http, port: 8000, targetPort: http}]
