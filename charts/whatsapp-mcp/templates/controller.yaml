apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wa.fullname" . }}-controller
  labels: {{ include "wa.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: controller}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: controller}
      annotations:
        checksum/worker-template: {{ include (print $.Template.BasePath "/worker-template.yaml") . | sha256sum }}
    spec:
      {{- with .Values.controller.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wa.fullname" . }}-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ include "wa.security" . | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "wa.image" (dict "root" . "image" .Values.app.image) | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: [python, -m, app.controller]
          securityContext: {{ include "wa.containerSecurity" . | nindent 12 }}
          env: {{ include "wa.appEnv" . | nindent 12 }}
            {{- include "wa.webhookRelayClientEnv" . | nindent 12 }}
            {{- if .Values.worker.enabled }}
            - {name: WORKER_JOB_TEMPLATE_FILE, value: /worker-template/job.json}
            {{- end }}
            - {name: WORKER_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: WORKER_MAX_ACTIVE_JOBS, value: "1"}
          resources: {{ toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.worker.enabled }}
            - {name: template, mountPath: /worker-template, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
            {{- include "wa.databaseMount" . | nindent 12 }}
      volumes:
        {{- if .Values.worker.enabled }}
        - {name: template, configMap: {name: {{ include "wa.fullname" . }}-worker-template}}
        {{- end }}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- include "wa.databaseVolume" . | nindent 8 }}
