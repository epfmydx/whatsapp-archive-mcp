apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wa.fullname" . }}-schema-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels: {{ include "wa.labels" . | nindent 4 }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: schema-bootstrap}
    spec:
      {{- with .Values.app.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      # Hooks run before regular release ServiceAccounts are created.
      serviceAccountName: default
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ include "wa.security" . | nindent 8 }}
      containers:
        - name: schema-bootstrap
          image: {{ include "wa.image" (dict "root" . "image" .Values.app.image) | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: [python, -m, app.init_db]
          securityContext: {{ include "wa.containerSecurity" . | nindent 12 }}
          env: {{ include "wa.appEnv" . | nindent 12 }}
          resources: {{ toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "wa.databaseMount" . | nindent 12 }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- include "wa.databaseVolume" . | nindent 8 }}
