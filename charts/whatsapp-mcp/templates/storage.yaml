{{- if and .Values.worker.enabled (not .Values.worker.modelCache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wa.fullname" . }}-model-cache
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.worker.modelCache.storageClass }}
  storageClassName: {{ .Values.worker.modelCache.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.worker.modelCache.size }}}
{{- end }}

{{- if and (eq .Values.storage.backend "disk") (not .Values.storage.disk.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wa.archiveClaim" . }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: {{ toYaml .Values.storage.disk.accessModes | nindent 4 }}
  {{- if .Values.storage.disk.storageClass }}
  storageClassName: {{ .Values.storage.disk.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.storage.disk.size }}}
{{- end }}
