{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}<div class="form-page login-page"><p class="eyebrow">Private archive</p><h1>Sign in</h1>
{% if error %}<p class="notice error" role="alert">Error: {{ error }}</p>{% endif %}
<form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="form-actions"><button>Sign in</button></div></form></div>{% endblock %}
